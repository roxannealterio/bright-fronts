<style>
:root{--paper:#FFFFFF;--sand:#F1EEEA;--ink:#231F1C;--muted:#5C534D;--soft:#7F756E;--line:#E4DFD9;--taupe:#9E8880;--bronze:#8A5A30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#1A1715;--sand:#24201D;--ink:#F2EEEA;--muted:#C9C0B8;--soft:#A2978F;--line:#36302C;--taupe:#B9A69D;--bronze:#D9A877}}
:root[data-theme="dark"]{--paper:#1A1715;--sand:#24201D;--ink:#F2EEEA;--muted:#C9C0B8;--soft:#A2978F;--line:#36302C;--taupe:#B9A69D;--bronze:#D9A877}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.7 "Schibsted Grotesk","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ink)}
:focus-visible{outline:2px solid var(--bronze);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}
header{height:76px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:10px;min-height:44px;text-decoration:none;font-weight:800;font-size:21px;letter-spacing:-0.03em}
.mark{width:26px;height:26px;border-radius:8px;background:var(--ink);position:relative;overflow:hidden}
.mark::after{content:"";position:absolute;inset:0 0 0 50%;background:var(--taupe)}
main{max-width:760px;padding:clamp(40px,6vw,80px) 0 96px}
h1{font-size:clamp(40px,6vw,64px);font-weight:800;letter-spacing:-0.045em;line-height:1;margin:0 0 14px}
.meta{color:var(--soft);font-size:15px;margin:0 0 36px}
.summary{background:var(--sand);border-radius:18px;padding:22px 26px;margin-bottom:36px}
.summary h2{margin:0 0 8px;font-size:18px}
.summary ul{margin:0;padding-left:20px;color:var(--muted)}
h2{font-size:24px;font-weight:700;letter-spacing:-0.02em;margin:44px 0 10px;line-height:1.2}
p,li{color:var(--muted)}
p{margin:0 0 14px}
ul{padding-left:22px;margin:0 0 14px}
li{margin-bottom:6px}
strong{color:var(--ink);font-weight:600}
footer{border-top:1.5px solid var(--line);padding:32px 0 48px;font-size:15px;color:var(--soft)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer nav{display:flex;gap:22px}
footer a{color:var(--muted);text-decoration:none}
h1{font-family:"Fraunces",Georgia,serif!important;font-weight:400!important;letter-spacing:-0.025em!important}

/* ============ one look, everywhere ============
   The site is always shown in its dark, warm palette (whatever the visitor's phone is set to),
   with one background for every section. Separation comes from spacing and matching cards,
   not from bands of slightly different colour. */
html:root:not(#bf){
  color-scheme:dark;
  --paper:#1A1715; --shell:#1A1715; --sand:#221E1B; --card:#221E1B; --line:#342E2A;
  --ink:#F2EEEA; --muted:#C9C0B8; --soft:#A2978F; --taupe:#B9A69D; --deep:#D2C3BA; --bronze:#D9A877;
  --dark:#221E1B; --on-dark:#F6F3EF; --on-dark-muted:#BDB3AA; --dark-line:#3A332E;
  --surface:#221E1B; --edge:rgba(246,243,239,.08); --edge-hi:rgba(246,243,239,.42);
}
html,body{background:#1A1715}
.tone-a,.tone-b,.tone-c,.work,.showcase,footer{background:transparent}
/* every card sits on the same raised surface with the same hairline */
.plan,.swap,.extra,.plain-steps li,.start-panel,.then,.care,.tp,.browser,.inbox,.mail,.v-card,.step .vis,.no-photo,.for-pt,.box{background:var(--surface);border:1px solid var(--edge);box-shadow:none}
.stage::before{background:var(--surface);border:1px solid var(--edge)}
/* the recommended option: same card, brighter edge, cream button (like the hero) */
.plan.main{background:var(--surface);color:var(--ink);border:1.5px solid var(--edge-hi)}
.plan.main > p,.plan.main .price small{color:var(--muted)}
.plan .btn{background:transparent;color:var(--ink);border-color:var(--edge-hi)}
.plan.main .btn{background:var(--on-dark);color:#1A1715;border-color:var(--on-dark)}
.plan .btn:hover{background:rgba(246,243,239,.06)}
.plan.main .btn:hover{background:#fff}
.start-panel{border-radius:20px}
.path{border-color:var(--edge)}
.path:hover{border-color:var(--edge-hi)}
.visit a,.visit button{border-color:var(--edge)}
.btn-line{border-color:var(--edge-hi)}
.menu-btn{border-color:var(--edge)}
summary .pm{background:var(--surface)}
details,details:first-of-type{border-color:var(--edge)}
.browser .chrome{background:#2A2522}
.browser .chrome i{background:#4A423D}
.browser .chrome span{background:#1F1B19;color:#A2978F}
.float{background:var(--surface);box-shadow:0 22px 44px -22px rgba(0,0,0,.7),0 0 0 1px var(--edge)}
.pop .tags span,.chipset span{background:#2B2623;border-color:var(--edge)}
.site-head{background:color-mix(in srgb,#1A1715 88%,transparent)}
.site-head.scrolled{box-shadow:0 1px 0 var(--edge)}
footer{border-top:1px solid var(--edge)}
/* icons that sit on a cream chip need a dark stroke */
.for-pt i svg,.arrow svg,.pop .hd i svg,.done-mark svg,.opt .tick svg,.big-call i svg{stroke:#1A1715}
.big-call i{background:#1A1715}.big-call i svg{stroke:#F6F3EF}
/* the sample text conversation stays a light phone screen */
.chat{background:#FAF9F7;color:#231F1C}
.chat .who b,.msg.us{color:#231F1C}
.chat .who,.chat .time{color:#7F756E}
</style>
